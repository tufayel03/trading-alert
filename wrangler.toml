name = "trading-alert"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["* * * * *"]

# OPTIONAL: KV Namespace for persistent alert deduplication across Worker restarts.
# To enable persistent KV dedup:
# 1. Run: npx wrangler kv namespace create ALERT_KV
# 2. Uncomment the 3 lines below and replace YOUR_ACTUAL_KV_ID with the ID returned by Wrangler.
#
# [[kv_namespaces]]
# binding = "ALERT_KV"
# id = "YOUR_ACTUAL_KV_ID"

# Set Discord webhook URL: npx wrangler secret put DISCORD_WEBHOOK_URL

