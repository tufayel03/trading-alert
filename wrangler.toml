name = "trading-alert"
main = "src/index.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["* * * * *"]

# KV Namespace for alert deduplication (prevents same alert firing every minute).
# To create it, run: npx wrangler kv namespace create ALERT_KV
# Then replace the id below with the id from the output.
# If you have already run that command, get your ID from: npx wrangler kv namespace list
[[kv_namespaces]]
binding = "ALERT_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# Set Discord webhook: npx wrangler secret put DISCORD_WEBHOOK_URL
